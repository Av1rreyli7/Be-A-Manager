<!doctype html><html data-kmode="court"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/kit.css"><script src="/floodlights/vendor/gsap.min.js"></script><script src="/kit-motion.js"></script><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#04060a;color:#ffffff}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hardwood Legends</title>
<style>
:root{color-scheme:dark;--accent:#ffb400;--accent2:#ff5a1f;--panel:rgba(10,14,24,.93);--line:rgba(255,255,255,.12);--text:#f2f5fa;--muted:#9aa4b8;--good:#3ddc84;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;color:var(--text);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0}
#gl canvas{display:block}
.disp{font-family:Impact,"Arial Black","Segoe UI Black",sans-serif;letter-spacing:.5px}
/* ---------- screens ---------- */
#ui{position:fixed;inset:0;z-index:30;display:none;overflow:auto}
#ui.show{display:block}
.scr{min-height:100%;padding:36px 48px 40px;display:flex;flex-direction:column;position:relative}
.menu-bg{background:linear-gradient(105deg,rgba(3,5,10,.95) 0%,rgba(3,5,10,.78) 42%,rgba(3,5,10,.25) 100%)}
.dim-bg{background:rgba(3,5,10,.86);backdrop-filter:blur(3px)}
.streaks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.streaks i{position:absolute;top:-30%;width:3px;height:160%;background:linear-gradient(transparent,rgba(255,180,0,.45),transparent);transform:rotate(24deg);animation:streak 7s linear infinite;opacity:.7}
.streaks i:nth-child(2){animation-delay:-2s;background:linear-gradient(transparent,rgba(255,90,31,.4),transparent);width:2px}
.streaks i:nth-child(3){animation-delay:-4.5s;width:6px;opacity:.25}
.streaks i:nth-child(4){animation-delay:-5.7s;width:1px}
@keyframes streak{from{left:-15%}to{left:115%}}
.title{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:clamp(46px,8vw,112px);line-height:.88;background:linear-gradient(180deg,#fff 35%,#ffb400 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,160,0,.25))}
.subtitle{color:var(--accent);font-weight:800;letter-spacing:6px;font-size:13px;margin:14px 0 36px}
.mm{display:flex;flex-direction:column;gap:12px;max-width:340px}
.btn{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:13px 22px;font-weight:800;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;border-radius:4px;text-align:left;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--accent);color:#111;border-color:var(--accent);transform:translateX(6px)}
.btn.sm{padding:8px 14px;font-size:12px}
.btn.center{text-align:center}
.btn.sel{background:var(--accent);color:#111}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.h1{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:44px;letter-spacing:1px;margin-bottom:6px}
.muted{color:var(--muted)}
.foot{margin-top:auto;padding-top:24px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
/* team select */
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:18px}
@media (max-width:900px){.tsel{grid-template-columns:1fr}.scr{padding:24px 16px}}
.tcard{border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.tcard .wm{padding:22px 20px;position:relative;min-height:128px;display:flex;flex-direction:column;justify-content:center}
.tcard .wm .city{font-weight:800;letter-spacing:4px;font-size:13px;opacity:.9}
.tcard .wm .nm{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:48px;line-height:1;text-transform:uppercase}
.tcard .wm .ovr{position:absolute;right:18px;top:18px;text-align:center;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:6px}
.tcard .wm .ovr b{display:block;font-size:30px;font-family:Impact,"Arial Black",sans-serif}
.tcard .wm .ovr small{font-size:10px;letter-spacing:2px}
.tcard .body{padding:14px 18px}
.tlabel{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:800;margin-bottom:8px}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.pl .pos{display:inline-block;width:32px;color:var(--muted);font-weight:700}
.ovrb{display:inline-block;min-width:34px;text-align:center;border-radius:3px;font-weight:800;font-size:13px;padding:1px 4px;color:#111}
select{background:#141a28;color:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:4px;font-weight:700;font-family:inherit;pointer-events:auto}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#141a28;color:var(--muted);font-size:11px;letter-spacing:1px;padding:7px 6px;text-align:center;font-weight:800}
table.t td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
table.t td.l,table.t th.l{text-align:left}
table.t tr:hover td{background:rgba(255,255,255,.04)}
.tblwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:6px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.kv{display:flex;gap:10px;padding:5px 0;font-size:14px;align-items:baseline}
.kv kbd,.lg kbd{display:inline-block;min-width:26px;text-align:center;background:#222a3b;border:1px solid #3a4560;border-bottom-width:3px;border-radius:4px;padding:1px 6px;font-family:inherit;font-weight:800;font-size:12px;color:#fff}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#scorebug{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;height:48px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:Impact,"Arial Black",sans-serif}
.sb-team{display:flex;align-items:center;gap:12px;padding:0 14px;min-width:132px;justify-content:space-between;color:#fff;position:relative}
.sb-abbr{font-size:21px;letter-spacing:1px}
.sb-score{font-size:28px;min-width:38px;text-align:right}
.sb-fl{position:absolute;left:0;right:0;bottom:0;height:4px}
.sb-bonus{position:absolute;top:2px;right:6px;font-size:9px;letter-spacing:1px;font-family:Arial,sans-serif;font-weight:900;color:#ffe066}
.sb-poss{position:absolute;top:3px;left:5px;font-size:10px;color:#ffe066}
.sb-mid{background:#0c111d;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:20px}
.sb-q{color:var(--accent)}
.sb-shot{background:#1a1204;color:#ffb400;min-width:50px;display:flex;align-items:center;justify-content:center;font-size:24px}
.sb-shot.low{color:#ff3b3b;background:#240707}
#pcard{position:absolute;left:18px;bottom:18px;display:flex;align-items:stretch;background:rgba(8,11,20,.88);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:250px}
.pc-num{font-family:Impact,"Arial Black",sans-serif;font-size:34px;display:flex;align-items:center;justify-content:center;min-width:64px;padding:0 8px}
.pc-info{padding:8px 12px;flex:1}
.pc-name{font-weight:900;font-size:15px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.pc-meta{font-size:11px;color:var(--muted);letter-spacing:1px;margin:2px 0 6px;font-weight:700}
.pc-stam{height:6px;background:#222b3c;border-radius:3px;overflow:hidden}
.pc-stam div{height:100%;background:linear-gradient(90deg,#3ddc84,#b7f34b);width:100%;transition:width .2s}
#shotMeter{position:absolute;display:none;transform:translate(-50%,-100%)}
.sm-bar{width:16px;height:96px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.85);border-radius:9px;position:relative;overflow:hidden}
.sm-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#ffb400,#fff3b0)}
.sm-zone{position:absolute;left:0;right:0;background:rgba(61,220,132,.75);box-shadow:0 0 8px #3ddc84}
.sm-label{position:absolute;left:24px;top:30px;white-space:nowrap;font-weight:900;font-size:13px;letter-spacing:1px;text-shadow:0 2px 4px #000}
#ftMeter{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:none;text-align:center}
.ft-title{font-weight:900;letter-spacing:2px;font-size:13px;margin-bottom:6px;text-shadow:0 2px 6px #000}
.ft-bar{width:340px;height:18px;background:rgba(0,0,0,.65);border:2px solid #fff;border-radius:10px;position:relative;overflow:hidden}
.ft-zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.8)}
.ft-cursor{position:absolute;top:-2px;bottom:-2px;width:4px;background:#ffb400;box-shadow:0 0 8px #ffb400}
#popups{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:4px}
.pop{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:54px;color:#fff;text-shadow:0 0 18px rgba(255,160,0,.9),0 4px 0 #b34700,0 8px 20px rgba(0,0,0,.6);animation:pop 1.5s ease-out forwards;white-space:nowrap}
.pop.small{font-size:26px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}
.pop.blue{text-shadow:0 0 18px rgba(80,160,255,.9),0 4px 0 #0b3d91,0 8px 20px rgba(0,0,0,.6)}
.pop.red{text-shadow:0 0 18px rgba(255,60,60,.9),0 4px 0 #7a0000,0 8px 20px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:scale(.3);opacity:0}12%{transform:scale(1.15);opacity:1}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;display:none}
#banner .b1{display:inline-block;font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:60px;padding:6px 40px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 15%,rgba(0,0,0,.75) 85%,transparent)}
#banner .b2{font-weight:800;letter-spacing:3px;color:var(--accent);margin-top:6px}
#legend{position:absolute;right:16px;top:16px;background:rgba(8,11,20,.9);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:12px;display:none;max-height:calc(100% - 120px);overflow:auto}
.lg h4{font-size:10px;letter-spacing:2px;color:var(--accent);margin:8px 0 4px}
.lg div{padding:2px 0;white-space:nowrap}
#hint{position:absolute;right:16px;bottom:22px;font-size:11px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:1px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#camLabel{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-weight:900;letter-spacing:2px;font-size:12px;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:4px;opacity:0;transition:opacity .4s}
#ticker{position:absolute;left:18px;top:16px;font-size:12px;font-weight:800;letter-spacing:1px;display:flex;flex-direction:column;gap:4px}
#ticker div{background:rgba(8,11,20,.85);border-left:3px solid var(--accent);padding:4px 10px;animation:tick 4s forwards}
@keyframes tick{0%{opacity:0;transform:translateX(-20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;background:#05070c;font-weight:800;letter-spacing:3px}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.subp{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;cursor:pointer;pointer-events:auto;font-size:14px}
.subp:hover{border-color:var(--accent)}
.subp.sel{background:rgba(255,180,0,.2);border-color:var(--accent)}
.subp.out{opacity:.4;pointer-events:none}
.mini{height:5px;width:70px;background:#222b3c;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;background:#3ddc84}
.bconf{margin-bottom:16px}
.bhead{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:20px;letter-spacing:1px;margin-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ser{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:rgba(255,255,255,.035);font-size:13px}
.ser.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ser.tbd{color:var(--muted);font-style:italic}
.sr{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-weight:800;font-variant-numeric:tabular-nums}
.sr.lose{opacity:.45}.sr.win{color:#fff}
.sw{display:inline-block;width:9px;height:9px;border:1px solid;margin-right:6px;vertical-align:middle}
.sd{display:inline-block;min-width:16px;color:var(--muted);font-size:11px}
.sl{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.pog{display:flex;gap:18px;align-items:center;padding:16px 20px;border-radius:8px;margin:14px 0}
.pog .big{font-family:Impact,"Arial Black",sans-serif;font-size:38px;font-style:italic}

/* ==========================================================
   The Be-A-Manager look, shared with the landing page, Floodlights and Front Office:
   pure black, hairlines at 13 percent white, chamfered corners, Inter for reading,
   Chakra Petch for labels and big numbers, liquid glass buttons, and the glow
   button for the main action. The one accent is volt.
   Everything below only restyles the menus and the HUD. No behavior lives here,
   and the 3D court itself is not touched.
   ========================================================== */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/floodlights/fonts/inter.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url(/floodlights/fonts/chakra-petch-600.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(/floodlights/fonts/chakra-petch-700.woff2) format('woff2')}
:root{--accent:var(--k-accent);--accent2:var(--k-accent-2);--volt:var(--k-accent);--panel:rgba(10,14,20,.94);--line:var(--k-line);--line2:rgba(255,255,255,.24);--text:var(--k-ink);--muted:#9a9d98;--good:var(--k-good);--bad:var(--k-bad);
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;--f-lbl:'Chakra Petch','Inter',system-ui,sans-serif;--cut:14px}
html,body{background:var(--k-bg);font-family:var(--f-ui);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
::selection{background:var(--volt);color:var(--k-accent-ink)}
.disp{font-family:var(--f-lbl);font-weight:700;letter-spacing:.02em}

/* ---------- screens ---------- */
.scr{padding:44px 56px 44px}
.menu-bg{background:radial-gradient(55% 45% at 88% 6%,rgba(139,108,255,.16),transparent 70%),radial-gradient(60% 50% at 10% 0%,rgba(255,138,61,.16),transparent 70%),radial-gradient(60% 45% at 40% 112%,rgba(62,230,196,.08),transparent 70%),linear-gradient(100deg,rgba(4,6,10,.96) 0%,rgba(4,6,10,.82) 42%,rgba(4,6,10,.32) 100%)}
.dim-bg{background:radial-gradient(60% 40% at 90% 0%,rgba(255,138,61,.1),transparent 70%),rgba(4,6,10,.88);backdrop-filter:blur(4px)}
/* the old light streaks make way for the frame from the landing page: a hairline with cut corners */
.streaks i{display:none}
.streaks{inset:18px;z-index:0;--fl:rgba(255,255,255,.13);--fc:22px;
  background:
    linear-gradient(var(--fl),var(--fl)) var(--fc) 0/calc(100% - var(--fc)*2) 1px no-repeat,
    linear-gradient(var(--fl),var(--fl)) var(--fc) 100%/calc(100% - var(--fc)*2) 1px no-repeat,
    linear-gradient(var(--fl),var(--fl)) 0 var(--fc)/1px calc(100% - var(--fc)*2) no-repeat,
    linear-gradient(var(--fl),var(--fl)) 100% var(--fc)/1px calc(100% - var(--fc)*2) no-repeat,
    linear-gradient(to bottom right,transparent calc(50% - .65px),var(--fl) calc(50% - .65px),var(--fl) calc(50% + .65px),transparent calc(50% + .65px)) top left/var(--fc) var(--fc) no-repeat,
    linear-gradient(to bottom left,transparent calc(50% - .65px),var(--fl) calc(50% - .65px),var(--fl) calc(50% + .65px),transparent calc(50% + .65px)) top right/var(--fc) var(--fc) no-repeat,
    linear-gradient(to bottom left,transparent calc(50% - .65px),var(--fl) calc(50% - .65px),var(--fl) calc(50% + .65px),transparent calc(50% + .65px)) bottom left/var(--fc) var(--fc) no-repeat,
    linear-gradient(to bottom right,transparent calc(50% - .65px),var(--fl) calc(50% - .65px),var(--fl) calc(50% + .65px),transparent calc(50% + .65px)) bottom right/var(--fc) var(--fc) no-repeat}
.scr>:not(.streaks){position:relative;z-index:1}
.title{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:clamp(40px,7vw,96px);line-height:1;letter-spacing:.02em;text-transform:uppercase;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:transparent;background:var(--k-grad);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 26px rgba(255,138,61,.28))}
.title::first-line{color:#ffffff;-webkit-text-fill-color:#ffffff}
.subtitle{font-family:var(--f-lbl);font-weight:700;font-size:11px;letter-spacing:.2em;margin:18px 0 34px}
.h1{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin-bottom:8px}
.muted{color:var(--muted)}
.mm{gap:10px;max-width:330px}

/* ---------- buttons: liquid glass, and the glow button for the main action ---------- */
.btn{position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-lbl);font-weight:700;font-size:12px;letter-spacing:.1em;line-height:1.2;border-radius:6px;padding:14px 20px;color:#ffffff;
  border:1px solid rgba(198,198,198,.42);background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(0,0,0,.5) 46%,rgba(150,170,200,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease,color .25s ease,filter .35s ease,transform .15s ease}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.4) 48%,transparent 76%);transform:translateX(-130%);transition:transform .65s ease;pointer-events:none}
.btn:hover::after{transform:translateX(130%)}
.btn:hover{background:linear-gradient(135deg,rgba(210,225,255,.18),rgba(0,0,0,.35) 48%,rgba(180,195,220,.16));color:#ffffff;border-color:rgba(220,230,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 18px rgba(170,200,255,.16);transform:translateX(4px)}
.btn.center:hover,.btn.sm:hover,.foot .btn:hover{transform:none}
.btn:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
.btn.sm{padding:9px 13px;font-size:10.5px;letter-spacing:.09em;border-radius:5px}
.btn:active{transform:scale(.97)}
/* a picked option: volt wash, like the picked tabs in the other games */
.btn.sel,.btn.sel:hover{background:rgba(var(--k-accent-rgb),.1);color:var(--volt);border-color:var(--volt);box-shadow:none}
.btn.sel::after{display:none}

/* ---------- surfaces: black panels, hairlines, cut corners ---------- */
.panel,.tcard{border-radius:0;border:1px solid var(--line);background-origin:border-box;
  background:
    linear-gradient(to bottom left,transparent calc(50% - .65px),var(--line2) calc(50% - .65px),var(--line2) calc(50% + .65px),transparent calc(50% + .65px)) top right/var(--cut) var(--cut) no-repeat border-box,
    linear-gradient(to bottom left,transparent calc(50% - .65px),var(--line2) calc(50% - .65px),var(--line2) calc(50% + .65px),transparent calc(50% + .65px)) bottom left/var(--cut) var(--cut) no-repeat border-box,
    rgba(7,8,7,.94);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.tlabel{font-family:var(--f-lbl);font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--volt)}
/* team cards: the team colour stays, toned down so it reads as a light on black */
.tcard .wm{padding:22px 22px}
.tcard .wm::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.86) 100%);pointer-events:none}
.tcard .wm>:not(.ovr){position:relative;z-index:1}
.tcard .wm .ovr{z-index:1;border-radius:0;background:rgba(0,0,0,.5);border:1px solid var(--line)}
.tcard .wm .city{font-family:var(--f-lbl);font-weight:700;letter-spacing:.18em;font-size:10.5px}
.tcard .wm .nm{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:.02em;margin-top:6px}
.tcard .wm .ovr b{font-family:var(--f-lbl);font-weight:700;font-size:26px}
.tcard .wm .ovr small{font-family:var(--f-lbl);font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--muted)}
.pl{border-bottom-color:var(--line);font-size:13.5px}
.pl .pos{font-family:var(--f-lbl);font-size:11px;letter-spacing:.06em}
.ovrb{font-family:var(--f-lbl);font-weight:700;font-size:12px;border-radius:0;padding:2px 5px 1px;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px))}
select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;font-family:var(--f-ui);font-weight:600;font-size:13px;padding:9px 10px}
select:focus{outline:none;border-color:var(--volt);box-shadow:0 0 0 1px var(--volt)}
select option{background:#0a0b0a;color:#fff}

/* ---------- tables ---------- */
table.t{font-variant-numeric:tabular-nums}
table.t th{background:#0b0c0b;font-family:var(--f-lbl);font-weight:700;font-size:10px;letter-spacing:.1em;padding:9px 6px;border-bottom:1px solid var(--line)}
table.t td{border-bottom-color:rgba(255,255,255,.07)}
table.t tr:hover td{background:rgba(255,255,255,.035)}
.tblwrap{border-radius:0;border-color:var(--line);background:rgba(7,8,7,.9)}
.set-row{border-bottom-color:var(--line)}
.set-row b{font-weight:600}
.kv kbd,.lg kbd{background:#101210;border:1px solid #3b3e3a;border-bottom-width:1px;border-radius:4px;font-family:var(--f-lbl);font-weight:700;font-size:11px;padding:2px 6px}

/* ---------- HUD ---------- */
#scorebug{font-family:var(--f-lbl);font-weight:700;border-radius:0;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.6)}
.sb-abbr{font-size:17px;letter-spacing:.08em}
.sb-score{font-size:25px}
.sb-bonus{font-family:var(--f-lbl);color:var(--volt)}
.sb-poss{color:var(--volt)}
.sb-mid{background:#04060a;font-size:17px;letter-spacing:.04em;box-shadow:inset 0 -2px 0 rgba(var(--k-accent-rgb),.7)}
.sb-shot{background:#130a06;color:var(--volt);font-size:21px}
.sb-shot.low{color:#ff5a5a;background:#1d0707}
#pcard{background:rgba(0,0,0,.86);border-radius:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.pc-num{font-family:var(--f-lbl);font-weight:700;font-size:28px}
.pc-name{font-weight:700;font-size:13.5px;letter-spacing:.04em}
.pc-meta{font-family:var(--f-lbl);font-weight:700;font-size:10px;letter-spacing:.12em}
.pc-stam{height:4px;background:#222422;border-radius:0}
.pc-stam div{background:linear-gradient(90deg,var(--k-good),var(--k-teal))}
.sm-bar{border:1px solid rgba(255,255,255,.85);border-radius:3px}
.sm-fill{background:linear-gradient(0deg,var(--k-accent),var(--k-amber),#fff1c8)}
.sm-label{font-family:var(--f-lbl);font-weight:700;font-size:12px;letter-spacing:.1em}
.ft-title{font-family:var(--f-lbl);font-weight:700;font-size:12px;letter-spacing:.14em}
.ft-bar{border:1px solid #ffffff;border-radius:3px}
.ft-cursor{background:var(--volt);box-shadow:0 0 8px var(--volt)}
.pop{font-family:var(--f-ui);font-style:normal;font-weight:800;font-size:48px;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 0 20px rgba(var(--k-accent-rgb),.6),0 6px 20px rgba(0,0,0,.7)}
.pop.small{font-family:var(--f-lbl);font-weight:700;font-size:20px;letter-spacing:.12em;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}
.pop.blue{text-shadow:0 0 20px rgba(110,170,255,.75),0 6px 20px rgba(0,0,0,.7)}
.pop.red{text-shadow:0 0 20px rgba(255,80,80,.8),0 6px 20px rgba(0,0,0,.7)}
#banner .b1{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:52px;letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 15%,rgba(0,0,0,.8) 85%,transparent)}
#banner .b2{font-family:var(--f-lbl);font-weight:700;font-size:12px;letter-spacing:.2em;margin-top:10px}
#legend{background:rgba(0,0,0,.88);border-radius:0;border-color:var(--line)}
.lg h4{font-family:var(--f-lbl);font-weight:700;letter-spacing:.16em}
#hint{font-family:var(--f-lbl);font-weight:700;font-size:10px;letter-spacing:.12em}
#camLabel{font-family:var(--f-lbl);font-weight:700;font-size:11px;letter-spacing:.14em;border-radius:0;background:rgba(0,0,0,.7);box-shadow:0 0 0 1px var(--line)}
#ticker{font-weight:600;letter-spacing:.02em}
#ticker div{background:rgba(0,0,0,.82);border-left:2px solid var(--volt)}
#loading{background:var(--k-bg);font-family:var(--f-lbl);font-weight:700;font-size:11px;letter-spacing:.2em}
#loading .title{font-size:clamp(34px,6vw,54px)!important;text-align:center;color:#ffffff}

/* ---------- substitutions, bracket, player of the game ---------- */
.subp{border-radius:6px;border-color:var(--line);background:rgba(255,255,255,.02)}
.subp:hover{border-color:rgba(220,230,255,.6)}
.subp.sel{background:rgba(var(--k-accent-rgb),.1);border-color:var(--volt)}
.mini{height:4px;background:#222422;border-radius:0}
.mini i{background:#5fd38d}
.bhead{font-family:var(--f-ui);font-style:normal;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.ser{border-radius:0;border-color:var(--line);background:rgba(255,255,255,.025)}
.ser.me{border-color:var(--volt);box-shadow:none;background:rgba(var(--k-accent-rgb),.07)}
.pog{border-radius:0;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.pog .big{font-family:var(--f-lbl);font-style:normal;font-weight:700;font-size:32px}
table.t tr:hover td{background:rgba(var(--k-accent-rgb),.06)}
.h1{position:relative}
.h1::after{content:"";display:block;width:56px;height:3px;margin-top:10px;border-radius:2px;background:var(--k-grad);box-shadow:0 0 14px rgba(var(--k-accent-rgb),.5)}
.tlabel{color:var(--k-accent-hi)}
.tcard{position:relative}
.tcard::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--k-grad);pointer-events:none}
.pos-g{color:var(--k-pos-g)!important}.pos-f{color:var(--k-pos-f)!important}.pos-c{color:var(--k-pos-c)!important}

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function gauss(){ let u=0,v=0; while(!u)u=rand(); while(!v)v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function angDiff(a,b){ let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }
function hexToRgb(h){ const n=parseInt(h.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(r,g,b){ return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join(''); }
function shade(h,f){ const [r,g,b]=hexToRgb(h); return rgbHex(r*f,g*f,b*f); }
function lum(h){ const [r,g,b]=hexToRgb(h); return (0.299*r+0.587*g+0.114*b)/255; }
function colorDist(a,b){ const A=hexToRgb(a),B=hexToRgb(b); return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]); }
function rgba(h,a){ const [r,g,b]=hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function fmtClock(s){ s=Math.max(0,s); if(s<60) return s.toFixed(1); const m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }
function ordinal(n){ return n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th'); }
function textOn(h){ return lum(h)>0.6?'#111':'#fff'; }
function ovrColor(o){ return o>=90?'#b98cff':o>=85?'#3ddc84':o>=78?'#ffd24a':o>=70?'#ff9a3d':'#b0b8c8'; }
function distToSeg(px,pz,ax,az,bx,bz){ const vx=bx-ax,vz=bz-az; const l2=vx*vx+vz*vz||1; let t=((px-ax)*vx+(pz-az)*vz)/l2; t=clamp(t,0,1); return dist(px,pz,ax+vx*t,az+vz*t); }

function buildAttrs(name,h,ovr,arch,ov){
  const off = LEAGUE.archetypes[arch] || LEAGUE.archetypes.forward;
  const hf = (h-79)/4;
  const hAdj = {str:5,block:8,intD:6,oreb:7,dreb:7,close:2,speed:-4,accel:-4,handle:-4,perD:-3,steal:-2,three:-2,vert:-2};
  const a = {};
  ATTRS.forEach((k,i)=>{
    const j = (hashStr(name+k)%7)-3;
    a[k] = clamp(Math.round(ovr + off[i] + (hAdj[k]||0)*hf + j), 25, 99);
  });
  a.stam = clamp(a.stam, 62, 99);
  if(ov) Object.assign(a, ov);
  return a;
}
function teamRating(td){
  const o = td.players.map(p=>p[4]).sort((a,b)=>b-a);
  const w=[1.35,1.25,1.15,1.05,1,0.8,0.7,0.6];
  let s=0,ws=0; for(let i=0;i<w.length&&i<o.length;i++){ s+=o[i]*w[i]; ws+=w[i]; }
  return Math.round(s/ws);
}
function startersOf(td){
  const P=td.players; const idx=P.map((d,i)=>i).sort((a,b)=>P[b][4]-P[a][4]);
  const top=idx.slice(0,5);
  if(!top.some(i=>P[i][2]==="C" || P[i][3]>=83)){ const big=idx.slice(5).find(i=>P[i][2]==="C"); if(big!=null) top[4]=big; }
  top.sort((a,b)=>POS_ORDER.indexOf(P[a][2])-POS_ORDER.indexOf(P[b][2]) || P[a][3]-P[b][3]);
  return top;
}

const Sound = {

      const l=50+Math.random()*13, hue=28+Math.random()*7, sat=42+Math.random()*16;
      c.fillStyle=`hsl(${hue},${sat}%,${l}%)`; c.fillRect(x,y,len,ph);
      for(let g=0;g<3;g++){
        c.strokeStyle=`rgba(95,52,18,${0.05+Math.random()*0.09})`; c.lineWidth=1; c.beginPath();
        const gy=y+1+Math.random()*(ph-2), fr=0.01+Math.random()*0.02, ph0=Math.random()*6;
        c.moveTo(x,gy); for(let gx=x;gx<x+len;gx+=24) c.lineTo(gx, gy+Math.sin(gx*fr+ph0)*1.3); c.stroke();
      }

}

function baseShotPct(p, d, three){

  if(d<6) return 0.5+(p.r('close')-50)*0.006;
  if(d<13) return 0.42+((p.r("close")+p.r("mid"))/2-50)*0.0055;
  return 0.38+(p.r("mid")-50)*0.0055;
}
function contestInfo(p, interior){

    const toH = ((hx-p.x)*(d.x-p.x) + (0-p.z)*(d.z-p.z)) / (Math.max(0.1,dist(p.x,p.z,hx,0))*Math.max(0.1,dd));

    if(p.stepBackT>0) dd+=2.5;
    const rating = interior? (d.r('intD')*0.6+d.r('block')*0.4) : d.r('perD');
    let a = clamp((7-dd)/6,0,1) * (0.55+rating/99*0.45) * (1+(d.h-p.h)*0.18);
    if(d.y>0.5) a*=1.2; if(d.stance) a*=1.1; if(d.stumbleT>0) a*=0.2; else if(d.beatenT>0) a*=0.5;
    if(isCPU(d)) a*=diffCfg().aiDef;
    if(a>amt){ amt=a; best=d; bd=dd; }

function timingGrade(m, win){

  if(ae<=win*2.5) return {g:'GOOD',c:'#b7f34b',q:1};
  if(ae<=win*5) return {g:e<0?'SLIGHTLY EARLY':'SLIGHTLY LATE',c:'#ffb400',q:0};
  return {g:e<0?'VERY EARLY':'VERY LATE',c:'#ff4d4d',q:-1};
}

  if(r<pf+0.55) return 1+(rand()<0.5?-1:1)*(0.06+rand()*0.12);

}

function checkShootingFoul(sh, con, drive){

// ---------- layups / dunks ----------

// ---------- steals, dribble moves, pump fakes ----------
function attemptSteal(d, h){

  const dd=dist(d.x,d.z,h.x,h.z); if(dd>4.4) return;

  if(h.state==='shoot' || h.state==='finish'){ if(rand()<0.25) { commitFoul(d,h,'shooting'); if(h.state==='shoot'&&!h.released){} } return; }
  if(rand()<c){ d.stats.stl++; h.stats.to++; popup('STOLEN!', d.team===G.userTeam?'blue':'red'); crowd(d.team===G.homeIdx?0.9:0.3); Sound.squeak(1); gainBall(d); }

function doDribbleMove(p, type){

function callScreen(h){

  const cands=team.onCourt.filter(q=>q!==h && !q.inbounding).sort((a,b)=>(b.slot>=3?1:0)-(a.slot>=3?1:0) || dist(a.x,a.z,h.x,h.z)-dist(b.x,b.z,h.x,h.z));
  const s=cands[0]; if(!s) return;

// ---------- passing ----------
function throwPass(p, r, type='chest', oop=false, inbound=false){
  if(!r || r===p || !p.hasBall) return;
  const hp=handPos(p); p.hasBall=false; ball.holder=null; ball.state='air'; ball.shot=null; ball.noCatch=false;
  ball.x=hp.x; ball.y=Math.max(hp.y,3); ball.z=hp.z;
  const d0=dist(p.x,p.z,r.x,r.z);
  let T = type==='lob'? 0.75+d0*0.018 : Math.max(0.2, d0/(type==='bounce'?34:44));
  let tx=r.x+r.vx*T*0.7, tz=r.z+r.vz*T*0.7, ty=r.h*0.62;
  const hx=hoopX(p.team);
  if(oop){ const rl=Math.max(0.1,dist(r.x,r.z,hx,0)); tx=hx+(r.x-hx)/rl*1.4; tz=(r.z)/rl*1.4; ty=RIM_Y+1.3; T=Math.max(T, 0.85); }
  const err=(1-p.r('pass')/99)*2.2+(p.sprinting?0.8:0)+(type==='lob'?0.4:0);
  tx+=gauss()*err*0.4; tz+=gauss()*err*0.4;
  if(type==='bounce'){ const bx=lerp(ball.x,tx,0.6), bz=lerp(ball.z,tz,0.6), t1=T*0.55; ball.vx=(bx-ball.x)/t1; ball.vz=(bz-ball.z)/t1; ball.vy=(BALL_R-ball.y+0.5*GRAV*t1*t1)/t1; }
  else { ball.vx=(tx-ball.x)/T; ball.vz=(tz-ball.z)/T; ball.vy=(ty-ball.y+0.5*GRAV*T*T)/T; }
  const bad = !inbound && rand()<0.07-p.r('pass')*0.0006;
  ball.pass={from:p,to:r,type,oop,t:0,T,inbound,magnet:bad?0:1,interceptor:null};
  // interception roll
  if(!inbound || rand()<0.5){
    for(const d of G.teams[opp(p.team)].onCourt){ if(d===G.user && !G.user) continue;
      const ds=distToSeg(d.x,d.z,p.x,p.z,tx,tz); if(ds>3.2 || dist(d.x,d.z,p.x,p.z)<1.5) continue;
      let c=d.r("steal")*0.0028*(1-ds/3.2)*(type==='bounce'?0.55:type==='lob'?0.35:1)*(1+d0/60);
      if(isCPU(d)) c*=diffCfg().aiSteal*0.8; else if(d!==G.user) c*=0.7;
      if(rand()<c){ ball.pass.interceptor=d; break; }
    }
  }
  ball.catchT=0.12; ball.lastTouch=p.team; p.passAnimT=0.3; p.dribbling=false; Sound.pass();
  G.lastPass={from:p,to:r,t:G.time};
}
function pickPassTarget(p, dx, dz){
  const l=Math.hypot(dx,dz); if(l<0.01){ dx=Math.sin(p.facing); dz=Math.cos(p.facing); } else { dx/=l; dz/=l; }
  let best=null, bs=-1e9;
  for(const q of G.teams[p.team].onCourt){ if(q===p || q.inbounding) continue;
    const vx=q.x-p.x, vz=q.z-p.z, d=Math.hypot(vx,vz)||1; const dot=(vx*dx+vz*dz)/d;
    const s=dot*2.2-d/45+Math.min(openness(q),10)*0.02; if(s>bs){bs=s;best=q;} }
  return best;
}
function lobTarget(p){
  const hx=hoopX(p.team); let best=null, bd=1e9;
  for(const q of G.teams[p.team].onCourt){ if(q===p) continue; const d=dist(q.x,q.z,hx,0); const cut=(q.cutT>0||q.rollT>0)?-6:0; if(d+cut<bd){bd=d+cut;best=q;} }
  return best;
}

// ---------- substitutions ----------
function subValue(p, slot){ const fit=p.pos===POS_ORDER[slot]?0:(Math.abs(POS_ORDER.indexOf(p.pos)-slot)===1?-4:-15); return p.ovr - Math.max(0,72-p.stamina)*0.9 + fit - (p.fouls>=5&&G.quarter<4?6:0) - (p.fouledOut?999:0); }
function swapPlayers(team, slot, benchP, announce=true){
  const out=team.onCourt[slot]; const bi=team.bench.indexOf(benchP); if(bi<0) return;
  benchP.resetCourt(out.x,out.z); benchP.facing=out.facing; benchP.slot=slot; benchP.team=out.team;
  if(out.hasBall){ benchP.hasBall=true; ball.holder=benchP; }
  benchP.inbounding=out.inbounding;
  team.onCourt[slot]=benchP; team.bench[bi]=out; out.hasBall=false; out.inbounding=false;
  avatars[team.side][slot].setPlayer(benchP, team);
  if(G.user===out) G.user=benchP;
  if(G.inbound){ if(G.inbound.inb===out) G.inbound.inb=benchP; if(G.inbound.rec===out) G.inbound.rec=benchP; }

function doSubs(except){
  for(const t of [0,1]){
    const team=G.teams[t]; const auto = t!==G.userTeam || SETTINGS.autoSubs;
    team.onCourt.forEach((p,slot)=>{
      if(p===except) return;

      let best=null,bv=-1e9; for(const b of team.bench){ const v=subValue(b,slot); if(v>bv){bv=v;best=b;} }
      if(best && !best.fouledOut && (p.fouledOut || bv>subValue(p,slot)+4)) swapPlayers(team,slot,best);

// ---------- set pieces: inbound, free throws, tip-off, periods ----------
function setupInbound(t, x, z){
  if(G.clock<=0){ endPeriod(); return; }
  G.state='inbound'; G.stateT=1.2; G.inboundMax=3.5; ball.noCatch=false;
  ball.shot=null; ball.pass=null;
  if(G.possTeam!==t) changePossession(t);
  doSubs();
  const team=G.teams[t]; const baseline=Math.abs(x)>46;
  const inb=team.onCourt[baseline?4:2]; const rec=team.onCourt[inb.slot===0?1:0];
  for(const p of allPlayers()){ p.hasBall=false; p.inbounding=false; p.state='idle'; p.moveT=0; p.stance=false; p.chargeSet=false; }
  inb.x=clamp(x,-48.5,48.5); inb.z=clamp(z,-26.5,26.5); inb.vx=inb.vz=0; inb.y=0; inb.vy=0; inb.inbounding=true; inb.facing=Math.atan2(-inb.x*0.3,-inb.z);
  if(baseline) inb.facing=Math.atan2(-Math.sign(inb.x),0);
  inb.hasBall=true; ball.holder=inb; ball.state='held';
  G.inbound={inb,rec};

}
function doInboundPass(){
  const ib=G.inbound; if(!ib) return;
  const inb=ib.inb; let rec=ib.rec;
  if(openness(rec)<2.5){ const alt=G.teams[inb.team].onCourt.filter(q=>q!==inb).sort((a,b)=>openness(b)-openness(a)-(dist(a.x,a.z,inb.x,inb.z)-dist(b.x,b.z,inb.x,inb.z))*0.05)[0]; if(alt) rec=alt; }

  inb.inbounding=false;
}
function updateInbound(dt){
  G.stateT-=dt; G.inboundMax-=dt; const ib=G.inbound; if(!ib) return;

function setupFreeThrows(shooter, n){

}
function placeFT(){
  const s=G.ft.shooter, t=s.team, dir=G.dir[t], hx=hoopX(t);

  s.x=dir*28; s.z=0; s.facing=Math.atan2(hx-s.x,0); s.hasBall=true; ball.holder=s; ball.state='held';
  const defS=[[40,8.9],[40,-8.9],[33,8.9],[20,-15],[18,12]], offS=[[36.5,8.9],[36.5,-8.9],[20,14],[14,-4]];

  i=0; for(const p of G.teams[t].onCourt){ if(p===s) continue; const [x,z]=offS[i++]; p.x=dir*x; p.z=z; p.facing=Math.atan2(hx-p.x,-p.z); }
}
function ftProb(p){ return clamp(0.2+p.r('ft')*0.0078+(isCPU(p)?diffCfg().aiShot*0.5:0),0.3,0.95); }
function shootFT(make){
  const f=G.ft, s=f.shooter; f.phase='flight'; s.state='idle';

function updateFT(dt){
  const f=G.ft; if(!f) return;

  if(f.phase==='aim'){
    if(s.team===G.userTeam && !G.autopilot){ f.cursorT+=dt*(2.6+SETTINGS.diff*0.55); f.cursor=0.5+0.5*Math.sin(f.cursorT); f.zone=(0.05+s.r('ft')/99*0.09)*(1.3-SETTINGS.diff*0.12); }

}
function userFTPress(){

function ftResult(made){

  if(made){ s.stats.ftm++; s.stats.pts++; G.teams[t].score++; G.teams[t].qpts[G.quarter-1]=(G.teams[t].qpts[G.quarter-1]||0)+1; f.made++; Sound.swish(); crowd(t===G.homeIdx?0.5:0.2); }
  else if(t===G.homeIdx) Sound.ooh(0.6);
  const last = f.i>=f.n-1;

  G.ft=null;

    if(G.clock<=0){ deadThen(1.0,endPeriod); return; }
    G.state='live'; ball.noCatch=false; ball.catchT=0.05; if(ball.shot){ ball.shot.ftNoReb=false; ball.shot.kind='ftlive'; } G.shotClockOn=false; G.shotClock=24;
  }
}
function setupTipoff(){

  ball.holder=null; ball.state='dead'; ball.shot=null; ball.pass=null; ball.x=0; ball.y=5; ball.z=0; ball.vx=ball.vy=ball.vz=0;
  G.possTeam=-1; G.shotClockOn=false; G.shotClock=24;
  for(const t of [0,1]){ const d=G.dir[t]; const zs=t===0?1:-1; const pos=[[-d*14,0],[-d*7,8],[-d*7,-8],[d*6,9*zs],[-d*1.4,0]];
    G.teams[t].onCourt.forEach((p,i)=>{ p.resetCourt(pos[i][0],pos[i][1]); p.slot=i; p.facing=Math.atan2(d,0); }); }

}
function updateTipoff(dt){
  G.stateT+=dt; const tip=G.tip;

  if(tip.tossed && !tip.jumped && G.stateT>=1.45){ tip.jumped=true; jump(G.teams[0].onCourt[4]); jump(G.teams[1].onCourt[4]); }

    tip.decided=true; const c0=G.teams[0].onCourt[4], c1=G.teams[1].onCourt[4];
    const sc=p=>p.r('vert')*0.6+p.h*10+rand()*30; const w=sc(c0)>=sc(c1)?c0:c1;
    const tgt=G.teams[w.team].onCourt[0]; const T=0.8;
    ball.vx=(tgt.x-ball.x)/T; ball.vz=(tgt.z-ball.z)/T; ball.vy=(4.5-ball.y+0.5*GRAV*T*T)/T;
    ball.catchT=0.2; ball.lastTouch=w.team; G.tipWinner=w.team; G.state='live'; crowd(0.6);

}
function qLabel(q){ return q<=4? ['1ST','2ND','3RD','4TH'][q-1] : (q===5?'OT':(q-4)+'OT'); }
function endPeriod(){
  if(G.state==='final') return;
  for(const p of allPlayers()){ p.state='idle'; p.hasBall=false; }
  ball.holder=null; ball.state='dead'; ball.shot=null; ball.pass=null;
  const q=G.quarter;
  if(q>=4 && G.teams[0].score!==G.teams[1].score){ endGame(); return; }
  G.state='break'; G.stateT = q===2?4:2.8;
  banner(q===2?'HALFTIME':q>=4?'END OF REGULATION':`END OF ${ordinal(q).toUpperCase()} QUARTER`, q>=4?'TIED. ON TO OVERTIME':`${G.teams[0].td.abbr} ${G.teams[0].score} - ${G.teams[1].score} ${G.teams[1].td.abbr}`);
  for(const t of G.teams) for(const p of t.roster) p.stamina=Math.min(100,p.stamina+(q===2?30:12));
  G.pending=()=>{ banner('','',false); startPeriod(q+1); };
}
function startPeriod(q){
  G.quarter=q; G.clock = q<=4 ? SETTINGS.qLen*60 : Math.max(60, SETTINGS.qLen*60*5/12);
  G.teams.forEach(t=>t.teamFouls=0);
  if(q===3){ G.dir=[-G.dir[0],-G.dir[1]]; }
  if(q>4){ doSubs(); setupTipoff(); return; }
  const t = q===4? G.tipWinner : opp(G.tipWinner);
  for(const tm of [0,1]){ const d=G.dir[tm]; G.teams[tm].onCourt.forEach((p,i)=>{ p.resetCourt(-d*(10+i*3), (i-2)*6); }); }
  G.possTeam=-1;
  setupInbound(t, -G.dir[t]*48.3, 4);
}
function endGame(){
  G.state='final'; Sound.buzzer(1.4); crowd(1.2);
  const [a,b]=G.teams; const w=a.score>b.score?a:b;
  banner('FINAL', `${a.td.abbr} ${a.score} - ${b.score} ${b.td.abbr}  ·  ${w.td.name.toUpperCase()} WIN`);
  G.stateT=3.5; G.pending=()=>{ banner('','',false); onGameOver(); };
}

   SECTION 7 - AI (offense, defense, rebounding, plays)
   ===================================================================== */
const SPOTS = [[25,0],[19,16],[4,-22],[4,22],[6,-7]];
function spotFor(p){
  const t=p.team, dir=G.dir[t], hx=hoopX(t);
  let [dx,dz]=SPOTS[p.slot];
  if(p.slot===3 && p.r('three')<70){ dx=5; dz=9; }
  if(p.slot===4 && p.r('three')>=76){ dx=22; dz=-9; }
  if(p.slot===2 && p.r('three')<66){ dx=15; dz=-15; }
  if(G.play && G.play.type==='iso' && ball.holder && ball.holder!==p){ dz*=1.1; dx+=1.5; }
  dx+=Math.sin(G.time*0.45+p.slot*1.7)*1.6; dz+=Math.cos(G.time*0.38+p.slot)*1.6;
  let x=hx-dir*dx, z=dz;
  const h=ball.holder;
  if(h && h!==p && h.team===t && dist(x,z,h.x,h.z)<9){ z=-z; if(dist(x,z,h.x,h.z)<9) x-=dir*6; }
  return {x:clamp(x,-46,46), z:clamp(z,-23.5,23.5)};
}
function predictLanding(){
  if(ball.holder) return {x:ball.x,z:ball.z};
  let t=0; if(ball.y>5){ const a=0.5*GRAV, b=-ball.vy, c=5-ball.y; const disc=b*b-4*a*c; t=disc>0?(-b+Math.sqrt(disc))/(2*a):0; }
  return {x:clamp(ball.x+ball.vx*t,-46,46), z:clamp(ball.z+ball.vz*t,-24,24)};
}
function laneOpen(p){
  const hx=hoopX(p.team);
  for(const d of G.teams[opp(p.team)].onCourt){ if(d.stumbleT>0) continue; if(distToSeg(d.x,d.z,p.x,p.z,hx,0)<3 && dist(d.x,d.z,hx,0)<dist(p.x,p.z,hx,0)+1) return false; }
  return true;
}
function defenderInFront(p, r){
  const hx=hoopX(p.team); let ux=hx-p.x, uz=-p.z; const ul=Math.hypot(ux,uz)||1; ux/=ul; uz/=ul;
  for(const d of G.teams[opp(p.team)].onCourt){ const vx=d.x-p.x, vz=d.z-p.z, dd=Math.hypot(vx,vz); if(dd<r && (vx*ux+vz*uz)/(dd||1)>0.5 && d.stumbleT<=0) return d; }
  return null;
}
function estShot(p){
  const d=distHoop(p), three=isThreeAt(p.x,p.z,p.team);
  let pc = d<7? 0.55+(Math.max(p.r('layup'),p.r('dunk'))-60)*0.007 : baseShotPct(p,d,three);
  pc*=1-contestInfo(p,d<8).amount*0.5; if(d>29) pc*=0.3;
  pc+=isCPU(p)?diffCfg().aiShot:0;
  return {pc, three, ev:pc*(three?3:2)};
}
function bestPassTarget(p){
  let best=null;
  const hx=hoopX(p.team);
  for(const q of G.teams[p.team].onCourt){ if(q===p || q.inbounding) continue;
    const e=estShot(q); const op=openness(q);
    let s=e.ev + (op>8?0.2:0) + ((q.cutT>0||q.rollT>0) && dist(q.x,q.z,hx,0)<10 && op>3 ? 0.45:0);
    if(G.play && G.play.type==='iso' && q===G.play.star) s+=0.5;
    let risk=0; for(const d of G.teams[opp(p.team)].onCourt){ const ds=distToSeg(d.x,d.z,p.x,p.z,q.x,q.z); if(ds<3) risk+=(3-ds)/3*0.45; }
    s-=risk; s-=(G.passCount||0)>4?0.15:0;
    if(!best || s>best.s) best={p:q,s,oop:(q.cutT>0||q.rollT>0) && q.r('dunk')>=60 && dist(q.x,q.z,hx,0)<13};
  }
  return best;
}
function handlerAI(p, dt){
  if(p.state!=='idle' || p.inbounding){ if(p.inbounding) stop(p); return; }
  const t=p.team, dir=G.dir[t], hx=hoopX(t), dH=dist(p.x,p.z,hx,0);
  const nd=nearestOpp(p);
  if(p.dribbleDead){ stop(p); p.aiT-=dt; if(p.aiT<=0){ const b=bestPassTarget(p); if(b && rand()<0.6) throwPass(p,b.p); else startJumpShot(p); } return; }
  if(p.driving){
    moveTo(p, hx-dir*2, (p.z>0?1:-1)*1.2, 1.4);
    if(dH<(p.r('dunk')>80?8:6.5)){ p.driving=false; startFinish(p); return; }
    const blk=defenderInFront(p,3.2);
    if(blk && dH>9){ p.driving=false; p.aiT=0.05;
      const help=G.autoHelp && G.autoHelp[opp(t)]; const b=bestPassTarget(p);
      if(b && (help || rand()<0.5) && b.s>0.8){ throwPass(p,b.p,b.oop?'lob':'chest',b.oop); return; }
      if(rand()<0.4) doDribbleMove(p, rand()<0.5?'spin':'step');
    }
    return;
  }
  // screen in progress: dribble off it
  const scr=G.teams[t].onCourt.find(q=>q.screenFor===p && q.screening);
  p.aiT-=dt;
  let goal=p.aiGoal; if(!goal){ goal=p.aiGoal=spotFor(p); }
  if(scr){ goal={x:scr.x+(hx-scr.x)*0.15, z:scr.z+scr.screenSide*4}; }
  moveTo(p, goal.x, goal.z, p.x*dir<0?1.25:0.7);
  if(p.aiT>0) return;
  const df=diffCfg(); p.aiT=0.28+rand()*0.35+(isCPU(p)?df.react*0.5:0.1);
  if(p.x*dir<2 && G.possTime<8){ p.aiGoal={x:dir*20,z:clamp(p.z*0.5,-10,10)}; return; }
  const sc=G.shotClockOn?G.shotClock:24;
  const e=estShot(p);
  let thresh=1.02-Math.min(0.32,G.possTime*0.03); if(p.onFire) thresh-=0.12; if(G.play.type==='iso' && p===G.play.star) thresh-=0.08;
  if(sc<6) thresh=0.5; if(sc<2.8) thresh=0;
  if(dH<7.5 && e.pc>0.4){ startFinish(p); return; }
  if(dH<30 && e.ev>thresh && (G.possTime>2.5 || nd.d>9) && rand()<0.75){ startJumpShot(p); return; }
  const slash=(p.r('layup')+p.r('dunk'))/2;
  if(dH<30 && laneOpen(p) && rand()<0.2+slash/320){ p.driving=true; if(nd.d<5 && rand()<p.r('handle')/140) doDribbleMove(p,rand()<0.6?'cross':'spin'); return; }
  if(G.play.type==='pnr' && !G.play.called && G.possTime>2 && p.slot<=1){ callScreen(p); G.play.called=true; p.aiT=1.2; return; }
  const b=bestPassTarget(p);
  if(b && (b.s>e.ev+0.12 || (G.play.type==='iso' && b.p===G.play.star && p!==G.play.star)) && rand()<0.75){
    const type=b.oop?'lob':(rand()<0.25?'bounce':'chest'); throwPass(p,b.p,type,b.oop); return; }
  if(sc<3.5){ startJumpShot(p); return; }
  if(nd.d<4 && rand()<0.3){ const mv=['cross','spin','step','cross','euro'][(rand()*5)|0]; doDribbleMove(p, mv); return; }
  const sp=spotFor(p); p.aiGoal={x:clamp(sp.x+(rand()-0.5)*10,-45,45), z:clamp(sp.z+(rand()-0.5)*10,-23,23)};
  if(p.aiGoal.x*dir<3) p.aiGoal.x=dir*10;
}
function offBallAI(p, dt){
  const t=p.team, dir=G.dir[t], hx=hoopX(t);
  if(p.inbounding){ stop(p); return; }
  if(G.state==='inbound' && G.inbound && p===G.inbound.rec){ const inb=G.inbound.inb; let ux=-inb.x, uz=-inb.z; const ul=Math.hypot(ux,uz)||1; moveTo(p, inb.x+ux/ul*9, inb.z+uz/ul*9, 1.2); return; }
  if(ball.pass && ball.pass.to===p){
    if(ball.pass.oop){ const rl=Math.max(0.1,dist(p.x,p.z,hx,0)); moveTo(p, hx+(p.x-hx)/rl*1.4, p.z/rl*1.4, 1.4);
      const bd=Math.hypot(ball.x-p.x,ball.z-p.z); if(bd<9 && ball.vy<2 && p.y<=0.001) jump(p,1.1); }

      const d=moveTo(p,sx,sz,1.2); p.screening = d<1.4; if(p.screening) stop(p); }

    return; }
  if(p.rollT>0){ p.rollT-=dt; if(p.popOut) moveTo(p, hx-dir*22, p.z>0?8:-8, 1.1); else moveTo(p, hx-dir*4, p.z>0?2:-2, 1.25); return; }

    if(G.frontEst && p.slot!==0 && ball.holder && ball.holder!==p && rand()<cutP){ p.cutT=1.9; p.cutX=hx-dir*(2.5+rand()*3); p.cutZ=(rand()-0.5)*7; } }

function defenseAI(p, dt){

    } else if(p.state!=='finish'){

    if(p.y>0||p.vy!==0){ if(p.hangT>0){ p.vy=0; } else { p.vy-=GRAV*dt; } p.y+=p.vy*dt; if(p.y<=0){ p.y=0; p.vy=0; if(rand()<0.3) Sound.squeak(0.5); } }

function contactFoulCheck(h, d){

function collideRim(s){

}
function collideBoard(s){

  const face=s*BOARD_X, back=s*(BOARD_X+0.12);

  else { if(ball.x<face+BALL_R && ball.x>back-BALL_R){ if(ball.vx<0 && ball.x>face){ ball.x=face+BALL_R; ball.vx=-ball.vx*0.6; onBoardHit(Math.abs(ball.vx)); } else if(ball.vx>0 && ball.x<back){ ball.x=back-BALL_R; ball.vx=-ball.vx*0.6; } } }
}
function resolveShot(){ const sh=ball.shot; if(sh && !sh.resolved){ sh.resolved=true; if(!ball.noCatch) ball.catchT=0.12; if(sh.kind!=='ft') G.shotClockOn=false; } }

function updateBall(dt){
  if(ball.catchT>0) ball.catchT-=dt;

    if(!pa.oop && pa.magnet && tgt){ const vh=Math.hypot(ball.vx,ball.vz); const dx=tgt.x-ball.x, dz=tgt.z-ball.z, dl=Math.hypot(dx,dz)||1; const k=Math.min(1,(pa.type==='lob'?2:4.5)*dt); const s=Math.max(vh,18); ball.vx+=(dx/dl*s-ball.vx)*k; ball.vz+=(dz/dl*s-ball.vz)*k; }

}

/* =====================================================================
   SECTION 9 - RULES / STATE MACHINE

function updateRules(dt){
  const st=G.state;
  if(st==='dead'||st==='break'||st==='final'){ G.stateT-=dt; if(G.stateT<=0 && G.pending){ const f=G.pending; G.pending=null; f(); } return; }
  if(st==='inbound'){ updateInbound(dt); return; }
  if(st==='ft'){ updateFT(dt); return; }
  if(st==='tipoff'){ updateTipoff(dt); return; }
  const sh=ball.shot;
  if(sh && sh.resolved && !sh.scored && sh.fouler && sh.kind!=='ft' && sh.kind!=='ftlive'){
    ball.noCatch=true; sh.fw+=dt;
    if(sh.fw>0.7){ const s=sh.shooter; s.stats.fga--; if(sh.three) s.stats.tpa--; ball.shot=null; G.nextPoss=s.team; endLiveBall(); deadThen(0.5,()=>setupFreeThrows(s, sh.pts)); }
    return;
  }
  if(st==='buzzer'){
    if(!ball.shot || ball.shot.scored){ return; }
    if(ball.shot.resolved && !ball.shot.fouler){ finalizeMiss(ball.shot); deadThen(1.2,endPeriod); }
    return;
  }
  // --- live ---
  G.clock-=dt; G.possTime+=dt;
  const inFlight = ball.shot && !ball.shot.resolved;
  if(G.shotClockOn && G.possTeam>=0 && !inFlight) G.shotClock-=dt;
  if(G.clock<=0){ G.clock=0; Sound.buzzer();
    if(inFlight && ball.shot.kind!=='ft'){ G.state='buzzer'; }
    else { endLiveBall(); deadThen(1.2,endPeriod); }
    return; }
  if(G.shotClockOn && G.shotClock<=0){ G.shotClock=0; Sound.buzzer(0.6); const h=ball.holder; turnover(h&&h.team===G.possTeam?h:null,'SHOT CLOCK VIOLATION',ball.x,ball.z); return; }
  const h=ball.holder;
  if(h){
    const d=G.dir[h.team];
    if(h.x*d>0.5) G.frontEst=true;
    else if(G.frontEst && h.x*d<-0.5 && !h.inbounding){ turnover(h,'BACKCOURT VIOLATION',h.x,h.z); return; }
    if(!h.inbounding && (Math.abs(h.x)>47 || Math.abs(h.z)>25)){ turnover(h,'OUT OF BOUNDS',h.x,h.z); return; }
    if(h.dribbleDead && h.state==='idle' && dist(h.x,h.z,h.pickX,h.pickZ)>3.2){ turnover(h,'TRAVELING',h.x,h.z); return; }
  } else if(ball.state==='air' && !(ball.pass && ball.pass.inbound) && !inFlight){
    if((Math.abs(ball.x)>47.3 || Math.abs(ball.z)>25.3) && ball.y<5){
      const t=opp(ball.lastTouch); if(ball.shot) finalizeMiss(ball.shot);
      popup('OUT OF BOUNDS','small'); Sound.whistle(); const bx=ball.x, bz=ball.z; endLiveBall(); ball.shot=null; G.nextPoss=t;
      deadThen(1.2,()=>{ if(G.possTeam!==t) changePossession(t); setupInbound(t, Math.abs(bx)>47?Math.sign(bx)*48.3:clamp(bx,-40,40), Math.abs(bx)>47?clamp(bz,-20,20):(bz>=0?1:-1)*26.3); });
    }
  }
}

function camBasis(){ const f=new THREE.Vector3(); camera.getWorldDirection(f); f.y=0; if(f.lengthSq()<1e-4) f.set(0,0,-1); f.normalize(); return {fx:f.x,fz:f.z,rx:-f.z,rz:f.x}; }
function handleInput(dt){
  const u=G.user; if(!u || G.autopilot) return;
  const st=G.state;
  // FT
  if(st==='ft'){ stop(u); if(pressed.W) userFTPress(); return; }
  let ix=0,iy=0; if(keys.Up) iy+=1; if(keys.Down) iy-=1; if(keys.Right) ix+=1; if(keys.Left) ix-=1;
  const b=camBasis(); let mx=b.rx*ix+b.fx*iy, mz=b.rz*ix+b.fz*iy; const ml=Math.hypot(mx,mz); if(ml>0){ mx/=ml; mz/=ml; }
  u.inDX=mx; u.inDZ=mz;
  const canMove = (st==='live'||st==='inbound'||st==='buzzer') && !u.inbounding && u.state!=='finish';
  const defending = !u.hasBall && G.possTeam>=0 && G.possTeam!==u.team && ball.holder;
  u.stance = defending && !!keys.D && st==='live';
  u.chargeSet = defending && !!keys.Z && st==='live' && Math.hypot(u.vx,u.vz)<3;
  if(canMove){ u.sprinting = !!keys.Shift && ml>0 && u.stamina>8; const sp=maxSpeed(u,u.sprinting); u.dvx=mx*sp; u.dvz=mz*sp; }
  else stop(u);
  if(st==='inbound'){ if(pressed.A && G.inbound && G.inbound.inb.team===G.userTeam) doInboundPass(); return; }
  if(st!=='live') return;
  if(u.hasBall){
    if(pressed.W && u.state==='idle'){ if(distHoop(u)<8.5) startFinish(u); else startJumpShot(u); }
    if(released.W && u.state==='shoot' && !u.released) releaseShot(u, u.shootT/u.shotIdeal);
    if(u.state==='idle' || u.state==='fake'){
      if(pressed.A){ const t=pickPassTarget(u,mx,mz); if(t){ u.state='idle'; throwPass(u,t,'chest'); } }
      if(pressed.S) G.sDown=G.time;
      if(keys.S && G.sDown!=null && G.time-G.sDown>0.28 && u.hasBall){ G.sDown=null; const t=lobTarget(u); if(t){ const hx=hoopX(u.team); const oop=t.r('dunk')>=55 && dist(t.x,t.z,hx,0)<16; if(oop){ t.cutT=1.5; t.cutX=hx-G.dir[u.team]*2; t.cutZ=0; } u.state='idle'; throwPass(u,t,'lob',oop); } }
      if(released.S && G.sDown!=null){ G.sDown=null; const t=pickPassTarget(u,mx,mz); if(t && u.hasBall){ u.state='idle'; throwPass(u,t,'bounce'); } }
    }
    if(pressed.D) pumpFake(u);
    if(pressed.Z) doDribbleMove(u,'cross'); if(pressed.X) doDribbleMove(u,'spin'); if(pressed.C) doDribbleMove(u,'step'); if(pressed.V) doDribbleMove(u,'euro');
    if(pressed.Space) callScreen(u);
  } else {
    if(pressed.W) jump(u);
    if(pressed.S){ const n=nearestTo(G.userTeam, ball.x, ball.z, u); if(n) setUser(n); }
    if(defending){
      const h=ball.holder;
      if(pressed.A) attemptSteal(u,h);
      if(pressed.X){ let best=null,bd=-1; for(const d of G.teams[u.team].onCourt){ if(d===u) continue; const m=G.teams[opp(u.team)].onCourt[d.slot]; const dd=dist(m.x,m.z,h.x,h.z); if(dd>bd){bd=dd;best=d;} } if(best){ G.help={type:'help',p:best,t:4}; popup('HELP DEFENSE','small'); } }
      if(pressed.C){ const d=nearestTo(u.team,h.x,h.z,u); if(d){ G.help={type:'double',p:d,t:3}; popup('DOUBLE TEAM!','small'); } }
      if(pressed.V){ const scr=G.teams[h.team].onCourt.find(q=>q.screening); const d= scr? G.teams[u.team].onCourt[scr.slot] : nearestTo(u.team,h.x,h.z,u); if(d && d!==u){ G.help={type:'hedge',p:d,t:1.6}; popup('HEDGE!','small'); } }
    } else if(pressed.A && ball.pass && ball.pass.from.team!==u.team && dist(u.x,u.z,ball.x,ball.z)<4){ u.stealAnimT=0.3; if(rand()<u.r('steal')/200) ball.pass.interceptor=u; }
  }
}

const camState={fx:0,fz:0,pos:new THREE.Vector3(0,31,60),look:new THREE.Vector3(),shake:0};
function updateCamera(dt,t){
  if(G.mode!=='game'){ const a=t*0.07; camera.position.set(Math.cos(a)*82, 30+Math.sin(t*0.13)*6, Math.sin(a)*58); camera.lookAt(0,4,0); return; }
  let tx=ball.x, tz=ball.z; const u=G.user;
  if(u && G.state!=='ft'){ tx=tx*0.72+u.x*0.28; tz=tz*0.7+u.z*0.3; }
  if(G.state==='ft' && G.ft){ tx=G.ft.shooter.x+G.dir[G.ft.shooter.team]*6; tz=0; }
  const k=1-Math.exp(-dt*3.2); camState.fx+=(tx-camState.fx)*k; camState.fz+=(tz-camState.fz)*k;
  const fx=clamp(camState.fx,-40,40), fz=clamp(camState.fz,-20,20);
  let px,py,pz,lx,ly,lz;
  switch(SETTINGS.cam){
    case 1: px=fx*0.9; py=13; pz=40; lx=fx; ly=5; lz=fz*0.5-2; break;
    case 2: { const d=G.dir[G.userTeam]; px=fx-d*40; py=21; pz=fz*0.4; lx=fx+d*12; ly=3; lz=fz*0.5; break; }
    case 3: px=fx*0.6; py=60; pz=52; lx=fx*0.8; ly=0; lz=fz*0.3; break;
    default: px=fx*0.82; py=31; pz=58+fz*0.08; lx=fx*0.92; ly=3; lz=fz*0.45-2;
  }
  const k2=1-Math.exp(-dt*4); camState.pos.x+=(px-camState.pos.x)*k2; camState.pos.y+=(py-camState.pos.y)*k2; camState.pos.z+=(pz-camState.pos.z)*k2;
  camState.look.x+=(lx-camState.look.x)*k2; camState.look.y+=(ly-camState.look.y)*k2; camState.look.z+=(lz-camState.look.z)*k2;
  camera.position.copy(camState.pos);
  if(camState.shake>0.01){ const s=camState.shake; camera.position.x+=(rand()-0.5)*s; camera.position.y+=(rand()-0.5)*s; camState.shake*=Math.exp(-dt*6); }
  camera.lookAt(camState.look);
}

const Season={
  data: loadJSON('hl_season_v1'),
  save(){ saveJSON('hl_season_v1', this.data); },
  create(team){
    const n=SETTINGS.seasonLen; const others=[...Array(30).keys()].filter(i=>i!==team);
    for(let i=others.length-1;i>0;i--){ const j=(rand()*(i+1))|0; [others[i],others[j]]=[others[j],others[i]]; }
    const games=[]; for(let i=0;i<n;i++) games.push({opp:others[i%others.length], home:i%2===0, result:null});
    const standings={}; LEAGUE.teams.forEach(t=>standings[t.abbr]={w:0,l:0});
    this.data={team, games, gi:0, standings, len:n}; this.save();
  },
  simScore(a,b,homeA){ const ra=teamRating(LEAGUE.teams[a]), rb=teamRating(LEAGUE.teams[b]); const base=110+(rand()-0.5)*16; let m=(ra-rb)*1.25+(homeA?2.5:-2.5)+gauss()*11; if(Math.abs(m)<1) m=m<0?-2:2; return [Math.round(base+m/2), Math.round(base-m/2)]; },
  simOthers(){ const d=this.data; const g=d.games[d.gi]; const skip=new Set([d.team,g.opp]); const pool=[...Array(30).keys()].filter(i=>!skip.has(i));
    for(let i=pool.length-1;i>0;i--){ const j=(rand()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
    for(let i=0;i+1<pool.length;i+=2){ const [sa,sb]=this.simScore(pool[i],pool[i+1],true); this.rec(pool[i],pool[i+1],sa,sb); } },
  rec(a,b,sa,sb){ const S=this.data.standings; const A=LEAGUE.teams[a].abbr, B=LEAGUE.teams[b].abbr; if(sa>sb){S[A].w++;S[B].l++;} else {S[B].w++;S[A].l++;} },
  recordUserGame(res){ const d=this.data; const g=d.games[d.gi]; if(!g) return; g.result=res; this.rec(d.team,g.opp,res.us,res.them); this.simOthers(); d.gi++; this.save(); },
  simNext(){ const d=this.data; const g=d.games[d.gi]; if(!g) return; const [a,b]=this.simScore(d.team,g.opp,g.home); g.result={us:a,them:b,sim:true}; this.rec(d.team,g.opp,a,b); this.simOthers(); d.gi++; this.save(); },
  record(){ const d=this.data; let w=0,l=0; d.games.forEach(g=>{ if(g.result){ if(g.result.us>g.result.them) w++; else l++; } }); return {w,l}; }
};

const ROUND_NAMES=['Play-In','Play-In Final','First Round','Conference Semifinals','Conference Finals','NBA Finals'];
const HOME_PATTERN={1:[1],3:[1,0,1],5:[1,1,0,0,1],7:[1,1,0,0,1,0,1]};
Object.assign(Season,{
  pct(i){ const s=this.data.standings[LEAGUE.teams[i].abbr]; return s.w/Math.max(1,s.w+s.l); },
  confRank(conf){ const S=this.data.standings;
    return LEAGUE.teams.map((t,i)=>i).filter(i=>LEAGUE.teams[i].conf===conf).sort((a,b)=>{ const A=S[LEAGUE.teams[a].abbr], B=S[LEAGUE.teams[b].abbr];
      return this.pct(b)-this.pct(a) || B.w-A.w || teamRating(LEAGUE.teams[b])-teamRating(LEAGUE.teams[a]) || a-b; }); },
  startPlayoffs(bestOf){ const d=this.data; const P={bestOf, round:0, rounds:[], seeds:{}, seedOf:{}, champion:null};
    for(const c of ['East','West']){ P.seeds[c]=this.confRank(c).slice(0,10); P.seeds[c].forEach((t,i)=>{ P.seedOf[t]=i+1; }); }
    P.orig=Object.assign({},P.seedOf); d.playoffs=P; this.buildRound(); this.save(); },
  mkSeries(a,b,bestOf,conf){ const P=this.data.playoffs; // a = higher seed, holds home court
    if(conf!=='Finals' && P.seedOf[b]<P.seedOf[a]) [a,b]=[b,a];
    if(conf==='Finals' && (this.pct(b)>this.pct(a) || (this.pct(b)===this.pct(a) && teamRating(LEAGUE.teams[b])>teamRating(LEAGUE.teams[a])))) [a,b]=[b,a];
    return {a,b,wa:0,wb:0,bestOf,conf,games:[],winner:null,loser:null}; },
  buildRound(){ const P=this.data.playoffs, r=P.round, prev=P.rounds[r-1]||[], out=[];
    const byConf=(list,c)=>list.filter(s=>s.conf===c);
    for(const c of ['East','West']){ const s=P.seeds[c], pc=byConf(prev,c);
      if(r===0){ out.push(this.mkSeries(s[6],s[7],1,c), this.mkSeries(s[8],s[9],1,c)); }
      else if(r===1){ const [A,B]=pc; P.seedOf[A.winner]=7; out.push(this.mkSeries(A.loser,B.winner,1,c)); }
      else if(r===2){ const C=pc[0]; P.seedOf[C.winner]=8; const e=[s[0],s[1],s[2],s[3],s[4],s[5],P.rounds[0].find(x=>x.conf===c).winner,C.winner];
        out.push(this.mkSeries(e[0],e[7],P.bestOf,c), this.mkSeries(e[3],e[4],P.bestOf,c), this.mkSeries(e[2],e[5],P.bestOf,c), this.mkSeries(e[1],e[6],P.bestOf,c)); }
      else if(r===3||r===4){ for(let i=0;i<pc.length;i+=2) out.push(this.mkSeries(pc[i].winner,pc[i+1].winner,P.bestOf,c)); }
    }
    if(r===5){ out.push(this.mkSeries(prev.find(s=>s.conf==='East').winner, prev.find(s=>s.conf==='West').winner, P.bestOf, 'Finals')); }
    P.rounds[r]=out; },
  cur(){ const P=this.data.playoffs; return P.rounds[P.round]; },
  need(s){ return Math.floor(s.bestOf/2)+1; },
  homeA(s){ return !!(HOME_PATTERN[s.bestOf]||HOME_PATTERN[7])[s.games.length]; },
  addGame(s,aScore,bScore,sim){ s.games.push({a:aScore,b:bScore,homeA:this.homeA(s),sim:!!sim}); if(aScore>bScore) s.wa++; else s.wb++;
    const n=this.need(s); if(s.wa>=n){ s.winner=s.a; s.loser=s.b; } else if(s.wb>=n){ s.winner=s.b; s.loser=s.a; } },
  simSeriesGame(s){ const h=this.homeA(s); const [x,y]=this.simScore(h?s.a:s.b, h?s.b:s.a, true); this.addGame(s, h?x:y, h?y:x, true); },
  userSeries(){ const P=this.data.playoffs; if(!P || P.champion!=null) return null; const t=this.data.team; return this.cur().find(s=>s.winner==null && (s.a===t||s.b===t))||null; },
  finishRound(){ for(const s of this.cur()) while(s.winner==null) this.simSeriesGame(s); },
  advance(){ const P=this.data.playoffs; if(P.champion!=null) return; if(this.cur().every(s=>s.winner!=null)){ if(P.round===5) P.champion=this.cur()[0].winner; else { P.round++; this.buildRound(); } } },
  afterUserGame(s){ for(const o of this.cur()) if(o!==s && o.winner==null) this.simSeriesGame(o); if(s.winner!=null) this.finishRound(); this.advance(); this.save(); },
  userPlayoffGame(res){ const s=this.userSeries(); if(!s) return; const usA=s.a===this.data.team; this.addGame(s, usA?res.us:res.them, usA?res.them:res.us, false); this.afterUserGame(s); },
  simUserPlayoffGame(){ const s=this.userSeries(); if(!s) return; this.simSeriesGame(s); this.afterUserGame(s); },
  simUserSeries(){ const s=this.userSeries(); if(!s) return; while(s.winner==null){ this.simSeriesGame(s); if(s.winner==null) for(const o of this.cur()) if(o!==s && o.winner==null) this.simSeriesGame(o); } this.finishRound(); this.advance(); this.save(); },
  simRound(){ this.finishRound(); this.advance(); this.save(); },
  simToChampion(){ let guard=0; while(this.data.playoffs.champion==null && guard++<10){ this.finishRound(); this.advance(); } this.save(); },
  userStatus(){ const P=this.data.playoffs, t=this.data.team;
    if(P.seedOf[t]==null) return 'missed';
    for(const round of P.rounds) for(const s of round) if(s.loser===t){ const isPlayInA = round===P.rounds[0] && P.seeds[s.conf].indexOf(t)<=7; if(!isPlayInA) return 'out'; }
    if(P.champion===t) return 'champ'; if(P.champion!=null) return 'out';
    return this.userSeries()? 'active' : 'waiting'; }
});

function seriesLine(s){ const A=LEAGUE.teams[s.a].abbr, B=LEAGUE.teams[s.b].abbr;
  if(s.bestOf===1 && s.games.length){ const g=s.games[0]; return `${LEAGUE.teams[s.winner].abbr} wins ${Math.max(g.a,g.b)}-${Math.min(g.a,g.b)}`; }
  if(s.winner!=null) return `${LEAGUE.teams[s.winner].abbr} wins ${Math.max(s.wa,s.wb)}-${Math.min(s.wa,s.wb)}`;
  if(!s.games.length) return s.bestOf===1?'Single game':`Best of ${s.bestOf}`;
  if(s.wa===s.wb) return `Series tied ${s.wa}-${s.wb}`;
  return `${s.wa>s.wb?A:B} leads ${Math.max(s.wa,s.wb)}-${Math.min(s.wa,s.wb)}`; }
function seriesCard(s,playIn){ const P=Season.data.playoffs, me=Season.data.team; const seed=t=>playIn&&P.orig?P.orig[t]:P.seedOf[t];
  const row=(t,w)=>{ const td=LEAGUE.teams[t]; const cls=s.winner==null?'':(s.winner===t?'win':'lose');
    return `<div class="sr ${cls}"><span><span class="sw" style="background:${td.c1};border-color:${td.c2}"></span><span class="sd">${seed(t)||''}</span>${td.abbr}</span><b>${s.bestOf===1?(s.games[0]?(t===s.a?s.games[0].a:s.games[0].b):''):w}</b></div>`; };
  return `<div class="ser ${s.a===me||s.b===me?'me':''}">${row(s.a,s.wa)}${row(s.b,s.wb)}<div class="sl">${seriesLine(s)}</div></div>`; }
function bracketHTML(){
  const P=Season.data.playoffs; const col=(title,list,pi)=>`<div class="bcol"><div class="tlabel">${title}</div>${list.length?list.map(x=>seriesCard(x,pi)).join(''):'<div class="ser tbd">To be decided</div>'}</div>`;
  const conf=c=>{ const get=r=>(P.rounds[r]||[]).filter(s=>s.conf===c);
    return `<div class="bconf"><div class="bhead">${c.toUpperCase()}ERN CONFERENCE</div><div class="bracket">${col('Play-In',get(0).concat(get(1)),true)}${col('First Round',get(2))}${col('Semifinals',get(3))}${col('Conf. Finals',get(4))}</div></div>`; };

}
