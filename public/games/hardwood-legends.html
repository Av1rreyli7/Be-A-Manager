  const done=!g;
  show(`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="tlabel">SEASON MODE · ${LEAGUE.season}</div><div class="h1">${td.city.toUpperCase()} ${td.name.toUpperCase()}</div>
    <div style="font-size:22px;font-weight:900">${r.w}-${r.l} <span class="muted" style="font-size:14px">· ${ordinal(rank)} in the ${td.conf}</span></div></div>
    ${done?`<div class="panel" style="min-width:300px"><div class="tlabel">REGULAR SEASON COMPLETE</div><div style="font-weight:800">${rank<=6?`Clinched the ${ordinal(rank)} seed. You are in the playoffs.`:rank<=10?`Finished ${ordinal(rank)}. You are in the play-in tournament.`:`Finished ${ordinal(rank)}. You missed the postseason, but you can still sim the playoffs.`}</div><div class="muted" style="margin:10px 0 6px;font-size:12px;letter-spacing:1px">PLAYOFF SERIES LENGTH</div><div class="row">${[7,5,3,1].map(n=>`<button class="btn sm ${n===7?'primary':''}" data-a="startPlayoffs" data-v="${n}">${n===1?'Single game':'Best of '+n}</button>`).join('')}</div></div>`:
    `<div class="panel" style="min-width:300px"><div class="tlabel">NEXT GAME · ${d.gi+1} OF ${d.len}</div><div style="font-size:20px;font-weight:900">${g.home?'vs':'@'} ${LEAGUE.teams[g.opp].city} ${LEAGUE.teams[g.opp].name}</div><div class="muted">Opponent OVR ${teamRating(LEAGUE.teams[g.opp])}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary sm" data-a="seasonPlay">Play Game</button><button class="btn sm" data-a="seasonSim">Sim Game</button><button class="btn sm" data-a="seasonSimAll">Sim to End</button></div></div>`}</div>
    <div class="subgrid" style="margin-top:18px"><div><div class="tlabel">SCHEDULE</div><div class="tblwrap" style="max-height:50vh"><table class="t"><tr><th>#</th><th class="l">OPPONENT</th><th>OVR</th><th>RESULT</th></tr>${sched}</table></div></div>
    <div><div class="tlabel">STANDINGS</div>${['East','West'].map(c=>standingsTable(c)).join('')}</div></div>
    <div class="foot"><button class="btn" data-a="main">◀ Main Menu</button><button class="btn" data-a="seasonReset">Abandon Season</button></div>`, 'dim-bg');
}
function standingsTable(conf){
  const S=Season.data.standings; const my=LEAGUE.teams[Season.data.team].abbr;
  const list=Season.confRank(conf).map(i=>LEAGUE.teams[i]);
  return `<div class="tblwrap" style="max-height:24vh;margin-bottom:10px"><table class="t"><tr><th>#</th><th class="l">${conf.toUpperCase()}</th><th>W</th><th>L</th><th>PCT</th></tr>${list.map((t,i)=>{ const s=S[t.abbr]; const pct=s.w+s.l?(s.w/(s.w+s.l)).toFixed(3).replace(/^0/,''):'.000'; return `<tr style="${t.abbr===my?'background:rgba(var(--k-accent-rgb),.1)':''}"><td>${i+1}</td><td class="l"><span style="display:inline-block;width:10px;height:10px;background:${t.c1};border:1px solid ${t.c2};margin-right:6px"></span>${t.city} ${t.name}</td><td>${s.w}</td><td>${s.l}</td><td>${pct}</td></tr>`; }).join('')}</table></div>`;
}
function boxTable(T){
  const pl=T.roster.filter(p=>p.stats.sec>0||T.onCourt.includes(p)).sort((a,b)=>b.stats.sec-a.stats.sec);
  const pct=(m,a)=>a?`${m}-${a}`:'0-0';
  const tot=k=>pl.reduce((s,p)=>s+p.stats[k],0);
  return `<div class="tlabel" style="margin-top:16px;color:${colorDist(T.td.c1,'#000')<90?T.td.c2:T.td.c1};filter:brightness(1.6)">${T.td.city.toUpperCase()} ${T.td.name.toUpperCase()} - ${T.score}</div>
  <div class="tblwrap" style="max-height:none"><table class="t"><tr><th class="l">PLAYER</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG</th><th>FG%</th><th>3P</th><th>3P%</th><th>FT</th><th>FT%</th><th>TO</th><th>PF</th></tr>
  ${pl.map(p=>{ const s=p.stats; const pc=(m,a)=>a?Math.round(m/a*100)+'%':'-'; return `<tr><td class="l" style="white-space:nowrap"><b>${p.name}</b> <span class="muted">${p.pos}</span></td><td>${Math.round(s.sec/60*(12/SETTINGS.qLen))}</td><td><b>${s.pts}</b></td><td>${s.reb}</td><td>${s.ast}</td><td>${s.stl}</td><td>${s.blk}</td><td>${pct(s.fgm,s.fga)}</td><td>${pc(s.fgm,s.fga)}</td><td>${pct(s.tpm,s.tpa)}</td><td>${pc(s.tpm,s.tpa)}</td><td>${pct(s.ftm,s.fta)}</td><td>${pc(s.ftm,s.fta)}</td><td>${s.to}</td><td>${s.pf}</td></tr>`; }).join('')}
  <tr style="font-weight:900"><td class="l">TEAM</td><td></td><td>${tot('pts')}</td><td>${tot('reb')}</td><td>${tot('ast')}</td><td>${tot('stl')}</td><td>${tot('blk')}</td><td>${tot('fgm')}-${tot('fga')}</td><td>${tot('fga')?Math.round(tot('fgm')/tot('fga')*100)+'%':'-'}</td><td>${tot('tpm')}-${tot('tpa')}</td><td>${tot('tpa')?Math.round(tot('tpm')/tot('tpa')*100)+'%':'-'}</td><td>${tot('ftm')}-${tot('fta')}</td><td>${tot('fta')?Math.round(tot('ftm')/tot('fta')*100)+'%':'-'}</td><td>${tot('to')}</td><td>${tot('pf')}</td></tr></table></div>`;
}
function showBoxScore(){
  const [a,b]=G.teams; const home=G.teams[G.homeIdx], away=G.teams[1-G.homeIdx];
  const gs=p=>{ const s=p.stats; return s.pts+0.4*s.fgm-0.7*s.fga-0.4*(s.fta-s.ftm)+0.7*s.oreb+0.3*(s.reb-s.oreb)+s.stl+0.7*s.ast+0.7*s.blk-s.to-0.4*s.pf + ((a.score>b.score?a:b).roster.includes(p)?3:0); };
  const all=a.roster.concat(b.roster); const pog=all.reduce((x,y)=>gs(y)>gs(x)?y:x);
  const pt=G.teams[pog.team];
  const won=a.score>b.score;
  show(`<div class="tlabel">FINAL${G.quarter>4?(G.quarter===5?' / OT':` / ${G.quarter-4}OT`):''}</div>
    <div class="h1">${away.td.abbr} ${away.score} - ${home.score} ${home.td.abbr}</div>
    <div style="font-weight:900;color:${won?'var(--k-good)':'var(--k-bad)'};letter-spacing:2px">${won?'VICTORY':'DEFEAT'} · ${a.td.name.toUpperCase()}</div>
    <div class="pog" style="background:linear-gradient(90deg,${pt.td.c1},${shade(pt.td.c1,0.4)})"><div><div class="tlabel" style="color:#fff">PLAYER OF THE GAME</div><div class="big">${pog.name.toUpperCase()}</div>
      <div style="font-weight:800">${pog.stats.pts} PTS · ${pog.stats.reb} REB · ${pog.stats.ast} AST · ${pog.stats.stl} STL · ${pog.stats.blk} BLK · ${pog.stats.fgm}-${pog.stats.fga} FG</div></div></div>
    ${boxTable(away)}${boxTable(home)}
    <div class="foot">${FO?'<span></span><button class="btn primary" data-a="foClose">Back to Front Office ▶</button>':'<button class="btn" data-a="main">Main Menu</button>'+(G.season?'<button class="btn primary" data-a="seasonHub">Continue Season ▶</button>':'<button class="btn primary" data-a="rematch">Rematch ▶</button>')}</div>`, 'dim-bg');
}
function togglePause(){
  if(G.mode!=='game') return;
  if(G.paused){ G.paused=false; hideUI(); }
  else { G.paused=true; showPause(); }
}
function showPause(){
  const [a,b]=G.teams;
  show(`<div style="margin:auto;text-align:center;min-width:320px"><div class="h1">PAUSED</div>
    <div class="muted" style="margin-bottom:20px">${a.td.abbr} ${a.score} - ${b.score} ${b.td.abbr} · ${qLabel(G.quarter)} ${fmtClock(G.clock)}</div>
    <div class="mm" style="margin:0 auto">
    <button class="btn primary center" data-a="resume">Resume</button>
    <button class="btn center" data-a="subs">Substitutions</button>
    <button class="btn center" data-a="pSettings">Settings</button>
    <button class="btn center" data-a="pControls">Controls</button>
    <button class="btn center" data-a="quitGame">${FO?"Leave game (it won't count)":"Quit to Main Menu"}</button></div></div>`, 'dim-bg');
}
function showSubs(){
  const T=G.teams[G.userTeam];
  const item=(p,kind,i)=>`<div class="subp ${subSel&&subSel.kind===kind&&subSel.i===i?'sel':''} ${p.fouledOut?'out':''}" data-a="subPick" data-k="${kind}" data-i="${i}">
    <span><b>${kind==='c'?POS_ORDER[i]+' · ':''}${p.name}</b> <span class="muted">${p.pos} · ${p.ovr}</span></span>
    <span class="muted" style="font-size:12px">${p.stats.pts} PTS · ${p.fouls} PF <span class="mini"><i style="width:${p.stamina}%;background:${p.stamina<50?'#ff9a3d':'#3ddc84'}"></i></span></span></div>`;
  show(`<div class="h1">SUBSTITUTIONS</div><div class="muted">Click a player on the court, then a bench player to swap them. Stamina bars shown on the right.</div>
    <div class="subgrid" style="margin-top:16px"><div><div class="tlabel">ON THE COURT</div>${T.onCourt.map((p,i)=>item(p,'c',i)).join('')}</div>
    <div><div class="tlabel">BENCH</div>${T.bench.map((p,i)=>item(p,'b',i)).join('')}</div></div>
    <div class="foot"><button class="btn" data-a="pauseBack">◀ Back</button><button class="btn primary" data-a="resume">Resume</button></div>`, 'dim-bg');
}
const ACTIONS = {
  main:()=>{ if(FO){ foPost({type:"hl:close"}); return; } if(G.mode==='post'||G.mode==='game') exitToMenu(); else showMain(); },
  quick:()=>showTeamSelect('quick'),
  season:()=>{ if(Season.data && Season.data.games) showSeasonHub(); else showTeamSelect('season'); },
  rosters:()=>{ rosterTeam=selUser; rosterBack='main'; showRoster(); },
  settings:()=>{ settingsBack='main'; showSettings(); },
  controls:()=>{ controlsBack='main'; showControls(); },
  prev:(el)=>{ if(el.dataset.s==='u') selUser=(selUser+29)%30; else selOpp=(selOpp+29)%30; showTeamSelect(); },
  next:(el)=>{ if(el.dataset.s==='u') selUser=(selUser+1)%30; else selOpp=(selOpp+1)%30; showTeamSelect(); },
  viewRoster:(el)=>{ rosterTeam=el.dataset.s==='u'?selUser:selOpp; rosterBack='select'; showRoster(); },
  rosterBack:()=>{ if(rosterBack==='select') showTeamSelect(); else showMain(); },
  setDiff:(el)=>{ SETTINGS.diff=+el.dataset.v; saveSettings(); rerender(); },
  setQ:(el)=>{ SETTINGS.qLen=+el.dataset.v; saveSettings(); rerender(); },
  setCam:(el)=>{ SETTINGS.cam=+el.dataset.v; saveSettings(); rerender(); },
  setSound:(el)=>{ SETTINGS.sound=el.dataset.v==='1'; saveSettings(); Sound.init(); Sound.setMuted(!SETTINGS.sound); rerender(); },
  setSubs:(el)=>{ SETTINGS.autoSubs=el.dataset.v==='1'; saveSettings(); rerender(); },
  setLen:(el)=>{ SETTINGS.seasonLen=+el.dataset.v; saveSettings(); rerender(); },
  settingsBack:()=>{ settingsBack==='pause'?showPause():showMain(); },
  controlsBack:()=>{ controlsBack==='pause'?showPause():showMain(); },
  tipoff:()=>{ if(selUser===selOpp) selOpp=(selOpp+1)%30; G.lastMatch=[selUser,selOpp]; startGame(selUser,selOpp); },
  rematch:()=>{ startGame(G.teams[0].idx, G.teams[1].idx, {away:G.homeIdx===1}); },
  createSeason:()=>{ Season.create(selUser); showSeasonHub(); },
  seasonHub:()=>{ exitToMenuSilent(); showSeasonHub(); },
  seasonPlay:()=>{ const d=Season.data;
    if(d.playoffs){ const s=Season.userSeries(); if(!s) return showPlayoffs(); const usA=s.a===d.team, opp=usA?s.b:s.a, home=Season.homeA(s)===usA;
      const label=(s.bestOf===1?ROUND_NAMES[d.playoffs.round]:`${ROUND_NAMES[d.playoffs.round]} · GAME ${s.games.length+1} · ${seriesLine(s)}`).toUpperCase();
      startGame(d.team, opp, {season:true, away:!home, label}); return; }
    const g=d.games[d.gi]; startGame(d.team, g.opp, {season:true, away:!g.home}); },
  startPlayoffs:(el)=>{ Season.startPlayoffs(+el.dataset.v); showPlayoffs(); },
  poSimSeries:()=>{ Season.simUserSeries(); showPlayoffs(); },
  poSimRound:()=>{ Season.simRound(); showPlayoffs(); },
  poSimAll:()=>{ Season.simToChampion(); showPlayoffs(); },
  seasonNew:()=>{ Season.data=null; saveJSON("hl_season_v1",null); showTeamSelect("season"); },
  seasonSim:()=>{ if(Season.data.playoffs) Season.simUserPlayoffGame(); else Season.simNext(); showSeasonHub(); },
  seasonSimAll:()=>{ while(Season.data.gi<Season.data.len) Season.simNext(); showSeasonHub(); },
  seasonReset:(el)=>{ if(el.dataset.armed!=="1"){ el.dataset.armed="1"; el.textContent="Click again to abandon"; setTimeout(()=>{ if(el.isConnected){ el.dataset.armed=""; el.textContent="Abandon Season"; } },3000); return; } Season.data=null; saveJSON("hl_season_v1",null); showMain(); },
  resume:()=>{ subSel=null; G.paused=false; hideUI(); },
  subs:()=>{ subSel=null; showSubs(); },
  subPick:(el)=>{ const k=el.dataset.k, i=+el.dataset.i; const T=G.teams[G.userTeam];
    if(!subSel || subSel.kind===k){ subSel={kind:k,i}; showSubs(); return; }
    const slot=k==='c'?i:subSel.i, bi=k==='b'?i:subSel.i; swapPlayers(T,slot,T.bench[bi]); subSel=null; showSubs(); },
  pauseBack:()=>showPause(),
  pSettings:()=>{ settingsBack='pause'; showSettings(); },
  pControls:()=>{ controlsBack='pause'; showControls(); },
  quitGame:()=>{ if(FO){ FO.done=true; foPost({type:"hl:quit"}); return; } G.paused=false; exitToMenu(); },
  foClose:()=>foPost({type:"hl:close"}),
  hub:()=>{ location.href="/front-office"; }
};
function exitToMenuSilent(){ const keepSeason=true; for(const a of avatars.flat()) a.group.visible=false; ballMesh.visible=false; userRing.visible=false; passRing.visible=false; userArrow.visible=false; G={mode:'menu',time:0,crowdE:0.2}; }
let lastRender=null;
function rerender(){ const h=ui.querySelector('.h1'); const t=h?h.textContent:''; if(t.startsWith('SETTINGS')) showSettings(); else if(t.includes('SEASON')||t.includes('QUICK PLAY')) showTeamSelect(); else showSettings(); }
ui.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; Sound.init(); const f=ACTIONS[el.dataset.a]; if(f) f(el); });

/* =====================================================================
   FRONT OFFICE BRIDGE: opened from Front Office (?fo=1, inside an iframe), plays one
   scheduled game with the real rosters and sends the box score back.
   ===================================================================== */
var FO = /[?&]fo=1\b/.test(location.search) ? {start:null, done:false} : null;
function foPost(m){ try{ (window.parent||window).postMessage(m, location.origin); }catch(e){} }
function escHTML(t){ return String(t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function foResult(){
  return { gameId:FO.start.gameId, qLen:SETTINGS.qLen, userHome:G.homeIdx===0,
    teams:G.teams.map(T=>({ abbr:T.td.abbr, score:T.score, qpts:Array.from({length:Math.max(4,G.quarter)},(_,i)=>T.qpts[i]||0),
      players:T.roster.map(p=>({ foId:p.foId, starter:!!p.starterFO, stats:Object.assign({},p.stats) })) })) };
}
function foBegin(){
  const s=FO.start; SETTINGS.qLen=s.qLen; SETTINGS.diff=s.diff;
  const ui=LEAGUE.teams.push(s.user)-1, oi=LEAGUE.teams.push(s.opp)-1;
  startGame(ui, oi, {away:!s.userHome, label:s.label});
}
function foAbort(text){
  if(G.mode==='game'){ G.paused=true; G.mode='post'; }
  Sound.setMuted(true);
  document.getElementById('hud').style.display='none'; banner('','',false);
  show(`<div style="margin:auto;text-align:center;max-width:560px"><div class="h1">GAME OVER</div><div class="muted" style="margin:10px 0 22px;font-size:16px">${escHTML(text)}</div><button class="btn primary center" data-a="foClose">Back to Front Office ▶</button></div>`, 'dim-bg');
}
if(FO) addEventListener('message', e=>{
  if(e.origin!==location.origin) return; const m=e.data||{};
  if(m.type==='fo:start' && !FO.start && m.start){ FO.start=m.start; foBegin(); }
  else if(m.type==='fo:abort' && !FO.done){ FO.done=true; foAbort(m.text||'This game was simulated.'); }
});

/* =====================================================================
   SECTION 15 - MAIN LOOP
   ===================================================================== */
function onResize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.fov=camera.aspect<1.2?58:42; camera.updateProjectionMatrix();
  if(mirror){ const rt=mirror.getRenderTarget(); rt.setSize(Math.floor(innerWidth*0.6*renderer.getPixelRatio()), Math.floor(innerHeight*0.6*renderer.getPixelRatio())); } }
addEventListener('resize',onResize); onResize();
let lastT=performance.now(), rt=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; rt+=dt;
  if(G.mode==='game' && !G.paused){ try{ updateGame(dt); }catch(err){ console.error(err); } }
  else if(G.mode==='post'){ updatePlayersIdle(dt); }
  updateVisuals(dt,rt);
  renderer.shadowMap.needsUpdate=true;
  renderer.render(scene,camera);
  for(const k in pressed) delete pressed[k]; for(const k in released) delete released[k];
}
function updatePlayersIdle(dt){ /* keep the court static behind the box score */ }
setArenaTeams(LEAGUE.teams[menuTeam], LEAGUE.teams[(menuTeam+5)%30]);
drawShotClockTex('24');
selUser=menuTeam; selOpp=(menuTeam+7)%30;
if(FO){ show('<div style="margin:auto;text-align:center"><div class="h1">TIP-OFF</div><div class="muted">Loading your matchup…</div></div>'); foPost({type:"hl:ready"}); }
else showMain();
window.__HL_READY=true;
document.getElementById('loading').style.display='none';
requestAnimationFrame(frame);
window.__HL = {get G(){return G;}, ball, startGame, step(n,dt=1/60){ for(let i=0;i<n;i++){ updateGame(dt); for(const k in pressed) delete pressed[k]; for(const k in released) delete released[k]; if(G.state==="dead"&&G.pending==null){} if(G.mode!=="game") break; } return G.state; }, onGameOverHook:null};
</script>
